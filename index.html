<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Engineering Office</title>
<style>
:root{
 --bg:#eef2f6;--card:#ffffff;--ink:#172334;--mute:#65758a;--line:#d8e0e9;
 --accent:#f2a900;--accent-dark:#cc8500;--navy:#101d2d;--navy2:#1b2e43;
 --red:#c62828;--amber:#a96500;--green:#147a43;
 --redbg:#fff0ef;--ambbg:#fff5df;--grnbg:#e8f7ed;
 --shadow:0 8px 24px rgba(18,35,54,.07);--radius:16px;
}
@media(prefers-color-scheme:dark){
 :root{--bg:#0d141d;--card:#151f2b;--ink:#eef3f8;--mute:#9babbc;--line:#2b3949;
 --accent:#ffbf26;--accent-dark:#e7a300;--navy:#080e16;--navy2:#142235;
 --red:#ff8c84;--amber:#ffca6a;--green:#6fdda0;--redbg:#3b2021;--ambbg:#3b3019;--grnbg:#173527;
 --shadow:0 8px 24px rgba(0,0,0,.18)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:8px clamp(14px,3vw,32px);display:flex;align-items:center;gap:10px;flex-wrap:nowrap;border-bottom:3px solid var(--accent)}
header h1{font-size:16px;letter-spacing:.2px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
header h1:before{content:"KE";display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;background:var(--accent);color:#111c29;border-radius:10px;font-size:13px;font-weight:950;vertical-align:middle;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
header .who{color:#aebccb;font-size:11px;white-space:nowrap}
header #synced{display:none}
header button{padding:6px 11px;font-size:13px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
button:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(0,0,0,.1);border-color:var(--accent)}
button:active{transform:translateY(0)}
header button{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);color:white}
header button:hover{background:rgba(255,255,255,.16)}
button.primary{background:var(--accent);border-color:var(--accent);color:#172334;font-weight:800}
button:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
nav{display:flex;gap:5px;padding:8px clamp(10px,3vw,32px) 0;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;box-shadow:0 3px 10px rgba(18,35,54,.04)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:10px 10px 0 0;background:none;padding:10px 11px;font-size:14px;white-space:nowrap;color:var(--mute);box-shadow:none;font-weight:650}
nav button:hover{transform:none;box-shadow:none;background:var(--bg)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:850;background:linear-gradient(0deg,rgba(242,169,0,.12),transparent)}
nav .n{display:inline-block;min-width:21px;padding:1px 7px;margin-left:7px;border-radius:99px;background:var(--line);font-size:11px;text-align:center;font-weight:800}
nav .n.hot{background:var(--red);color:#fff}
main{max-width:1500px;margin:0 auto;padding:clamp(12px,2vw,26px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(14px,2vw,22px);margin-bottom:17px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-weight:800;letter-spacing:.1px}
.card h2:before{content:"";width:4px;height:19px;background:var(--accent);border-radius:5px;margin-right:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin-bottom:18px}
.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);min-height:112px}
.tile:after{content:"";position:absolute;right:-19px;top:-24px;width:82px;height:82px;border-radius:50%;background:var(--accent);opacity:.09}
.tile b{display:block;font-size:clamp(25px,3vw,34px);line-height:1.15;margin-bottom:8px;letter-spacing:-.8px;font-weight:850;font-variant-numeric:tabular-nums}
.tile span{color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.2px}
.tile.red{border-top:3px solid var(--red)}.tile.amber{border-top:3px solid var(--accent)}.tile.green{border-top:3px solid var(--green)}
.tile.red b{color:var(--red)}.tile.amber b{color:var(--amber)}.tile.green b{color:var(--green)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--bg);position:sticky;top:0}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
tbody tr:hover,table tr:hover td{background:rgba(242,169,0,.045)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow:auto;border-radius:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:850;letter-spacing:.035em;white-space:nowrap}
.custwrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.custlist{position:sticky;top:8px;margin-bottom:0}.custlist input{width:100%;margin-bottom:10px}
.custrows{display:flex;flex-direction:column;gap:6px;max-height:68vh;overflow:auto}
.custrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;text-align:left;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;cursor:pointer;font:inherit}
.custrow.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}.custrow b{flex:1 1 100%}
.custhead h2{margin:0 0 4px}
@media(max-width:820px){.custwrap{grid-template-columns:1fr}.custlist{position:static}.custrows{max-height:240px}}
.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--ambbg);color:var(--amber)}.pill.green{background:var(--grnbg);color:var(--green)}.pill.grey{background:var(--line);color:var(--mute)}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:14px;box-shadow:var(--shadow)}
.bar .sp{flex:1}
.bar select,.bar input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px}
.mute{color:var(--mute)}.small{font-size:12px}
.err{background:var(--redbg);color:var(--red);padding:12px 14px;border:1px solid currentColor;border-radius:12px;margin-bottom:12px}
.note{background:var(--ambbg);color:var(--amber);padding:12px 14px;border:1px solid rgba(242,169,0,.3);border-radius:12px;margin-bottom:14px;font-size:12px}
#login{max-width:390px;margin:12vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
#login h1{margin-top:0;font-size:26px;letter-spacing:-.7px}
#login h1:before{content:"KE";display:inline-grid;place-items:center;width:43px;height:43px;margin-right:11px;background:var(--accent);color:#172334;border-radius:12px;font-size:14px;font-weight:950;vertical-align:middle}
#login input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#login button{width:100%;margin-top:10px;padding:12px}
details summary{cursor:pointer;color:var(--accent-dark);font-weight:700}
.hide{display:none!important}
#msg:empty{display:none}

/* Control-room layer */
.commandbar{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 14px}
.command-search{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.command-search .search-icon{font-size:20px;color:var(--accent-dark)}
.command-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:7px 0}
.command-search .hint{font-size:10px;color:var(--mute);white-space:nowrap;border:1px solid var(--line);padding:3px 6px;border-radius:5px}
.command-status{display:none}
.command-status-old{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:15px;padding:12px 15px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.command-status .status-dot{width:10px;height:10px;border-radius:50%;background:#62d995;box-shadow:0 0 0 5px rgba(98,217,149,.14);flex-shrink:0}
.command-status b{display:block;font-size:12px}.command-status span{display:block;color:#c8d4e1;font-size:11px}
.search-results{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:-8px 0 18px;overflow:hidden}
.search-results .result-head{padding:10px 14px;background:var(--bg);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.search-results .result{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.search-results .result:hover{background:rgba(242,169,0,.08)}
.search-results .result-type{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:800}
.search-results .result-main{font-weight:750;overflow-wrap:anywhere}
.search-results .result-sub{font-size:11px;color:var(--mute);overflow-wrap:anywhere}
.search-results .result-go{font-size:11px;color:var(--accent-dark);font-weight:800}
.control-hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#101d2d 0%,#1d344b 68%,#2a4055 100%);color:#fff;border-radius:19px;padding:23px clamp(16px,3vw,30px);margin-bottom:17px;box-shadow:var(--shadow)}
.control-hero:after{content:"";position:absolute;right:-55px;top:-100px;width:280px;height:280px;border:35px solid rgba(242,169,0,.13);border-radius:50%;pointer-events:none}
.control-hero .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:#f2b92c;font-weight:900}
.control-hero h2{font-size:clamp(22px,3vw,32px);line-height:1.12;margin:8px 0 8px;letter-spacing:-.7px;max-width:700px}
.control-hero p{margin:0;color:#d0dce8;font-size:13px;max-width:650px}
.hero-bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px;position:relative;z-index:1}
.hero-bottom button{font-size:12px;font-weight:800}
.hero-bottom .hero-light{background:var(--accent);color:#142033;border-color:var(--accent)}
.hero-bottom .hero-dark{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.25)}
.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:17px}
.alert-card{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--card);text-align:left;box-shadow:var(--shadow);width:100%}
.alert-card .alert-symbol{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--bg);font-size:18px;flex-shrink:0}
.alert-card strong{display:block;font-size:22px;line-height:1.1}.alert-card span{display:block;font-size:11px;color:var(--mute);font-weight:700;margin-top:4px}
.alert-card.danger .alert-symbol{background:var(--redbg)}.alert-card.warning .alert-symbol{background:var(--ambbg)}.alert-card.good .alert-symbol{background:var(--grnbg)}
.alert-card:hover{border-color:var(--accent)}
.section-kicker{font-size:10px;color:var(--mute);font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin:2px 0 10px}
.overview-lower{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:16px;align-items:start}
.mini-action-list{display:grid;gap:8px}
.mini-action{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);text-align:left;width:100%;box-shadow:none}
.mini-action .mini-icon{width:33px;height:33px;display:grid;place-items:center;border-radius:9px;background:var(--bg);font-size:15px}
.mini-action b{display:block;font-size:12px}.mini-action small{display:block;color:var(--mute);font-size:10px}
.empty-state{padding:20px;text-align:center;color:var(--mute);font-size:12px}
@media(max-width:700px){.commandbar{grid-template-columns:1fr}.overview-lower{grid-template-columns:1fr}.search-results .result{grid-template-columns:70px minmax(0,1fr)}.search-results .result-go{display:none}.control-hero{padding:19px}.control-hero:after{right:-170px}}

@media(max-width:700px){
 header{padding:8px 10px;gap:6px}header h1{font-size:15px}
 header h1:before{width:28px;height:28px;margin-right:7px}
 header .who{display:none}
 nav{top:0;padding-left:6px;padding-right:6px}
 nav button{padding:10px 10px}
 main{padding:10px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .tile{padding:14px 12px;min-height:100px}
 .tile b{font-size:27px}
 .card{padding:13px;border-radius:13px}
 th,td{padding:9px 7px;font-size:12px}
 .bar{gap:7px}
}
@media(max-width:390px){.tiles{grid-template-columns:1fr 1fr}.tile b{font-size:24px}header h1{min-width:100%}}
/* engineer holidays */
.hgrid{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
.hgrid th,.hgrid td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:34px;min-width:29px}
.hgrid th{font-size:10px;line-height:1.2;padding:4px 0;border-radius:0;position:static}
.hgrid th.who,.hgrid td.who{text-align:left;padding:0 10px;min-width:92px;position:sticky;left:0;z-index:2;font-weight:800;font-size:12px;background:var(--card)}
.hgrid th.who{background:var(--bg)}
.hgrid th.we,.hgrid td.we{background:var(--bg)}
.hgrid th.bh,.hgrid td.bh{background:rgba(70,120,210,.22)}
.hgrid td.ap{background:var(--green);color:#fff;font-weight:800}
.hgrid td.pe{background:repeating-linear-gradient(45deg,var(--accent) 0 5px,transparent 5px 10px)}
.hgrid td.half{background:linear-gradient(90deg,var(--green) 50%,transparent 50%)}
.hgrid td.cl{box-shadow:inset 0 0 0 2px var(--red)}
.hgrid th.today{box-shadow:inset 0 -3px 0 var(--accent);font-weight:900}
.hgrid th.clash{color:var(--red);font-weight:900}
.hkey{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:10px}
.hkey i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px;border:1px solid var(--line)}
tr.hsoon td{background:var(--ambbg)}
@media print{
 header,nav,.bar button,#refresh,#out,.commandbar,.search-results{display:none!important}
 body{background:#fff;color:#111}
 main{max-width:none;padding:0}
 .card,.tile{box-shadow:none;break-inside:avoid;border-color:#bbb}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<body>

<div id="app" class="hide">
  <header>

    <section id="v-hols" class="hide"></section>
    <section id="v-portals" class="hide"></section>
    <section id="v-chat" class="hide"></section>

</div>

<script>
// Same Supabase project as the Crane Service Report, Job Manager and KEPO apps.
// The publishable key is meant to be public — row-level security in Supabase is what protects the data.
const SB = {url:'https://eyerpokgadrgxticqzez.supabase.co', key:'sb_publishable_FsyUdlUOTgA51pkAy5pNiA_AsHqq6Ed'};
const RATES = {nt:50, ot:64, dt:73, callout:100, mile:0.70};   // normal, OT1, OT2, call-out, per mile
const KINDS = {Service:'Service', Inspection:'Inspection', LOLER:'LOLER'};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const gbp = n => '£' + n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const monday = s => { const d=parse(s)||new Date(); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); };
const uk = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const todayIso = () => iso(new Date());
const store = { get(k){ try{ return JSON.parse(localStorage.getItem('ke_office_'+k)); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem('ke_office_'+k, JSON.stringify(v)); }catch(e){} },
                del(k){ try{ localStorage.removeItem('ke_office_'+k); }catch(e){} } };

function csvDownload(name, header, rows){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const text=[header].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name; a.click();
}

// ---------- auth + data ----------
async function token(){
  const s = store.get('session');
  if(!s) throw new Error('Not signed in');
  if(s.expires_at - 60 > Date.now()/1000) return s.access_token;
  const res = await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!res.ok){ store.del('session'); throw new Error('Session expired — please sign in again'); }
  return saveSession(await res.json()).access_token;
}
function saveSession(j){
  const s = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600), email:(j.user&&j.user.email)||(store.get('session')||{}).email||'', uid:(j.user&&j.user.id)||(store.get('session')||{}).uid||''};
  store.set('session', s); return s;
}
async function api(path, opts){
  const t = await token();
  const res = await fetch(SB.url+path, Object.assign({}, opts, {headers:Object.assign({apikey:SB.key, Authorization:'Bearer '+t}, (opts&&opts.headers)||{})}));
  if(!res.ok){ let m=''; try{ const j=await res.json(); m=j.message||j.error||''; }catch(e){} const e=new Error(`${res.status} ${m}`.trim()); e.status=res.status; throw e; }
  return res;
}
async function getAll(table, query){

// ---------- engineer names (Job Manager uses "Dave" and "Dave Boler" for the same person) ----------
function nameMap(){
  const names = new Set();
  D.jobs.forEach(j=> (j.data.engineers||[]).forEach(n=>{ n=String(n||'').trim(); if(n) names.add(n); }));
  D.reports.forEach(r=>{ const n=String(r.engineer||'').trim(); if(n) names.add(n); });
  const list=[...names], map={};
  list.forEach(n=>{
    const longer = list.filter(o=> o!==n && o.toLowerCase().split(/\s+/)[0]===n.toLowerCase() && o.includes(' '));
    map[n.toLowerCase()] = (!n.includes(' ') && longer.length===1) ? longer[0] : n;
  });
  return n => { n=String(n||'').trim(); return n ? (map[n.toLowerCase()]||n) : 'Unassigned'; };
}

// ---------- calculations ----------
function weekJobs(start){
  const end = addDays(start,6), canon = nameMap(), rows=[];
  D.jobs.forEach(j=>{
    const d=j.data, entries=(d.time||[]).filter(t=> t.date>=start && t.date<=end);
    const hasCallout = d.callout && ((d.date||'')>=start && (d.date||'')<=end);
    if(!entries.length && !hasCallout) return;
    const engs=(d.engineers||[]).map(canon), n=Math.max(1,engs.length);
    let nt=0,ot=0,dt=0,mile=0;
    entries.forEach(t=>{ nt+=num(t.nt); ot+=num(t.ot); dt+=num(t.dt); mile+=num(t.mile); });
    const labour = (nt*RATES.nt + ot*RATES.ot + dt*RATES.dt)*n, mileage = mile*RATES.mile, call = hasCallout?RATES.callout:0, mat = D.mats[j.id]||0;
    rows.push({id:j.id, job:d.job||j.id, customer:d.customerName||d.customer||'', site:d.site||'', type:d.type||'', status:d.status||'',
      engs: engs.length?engs:['Unassigned'], n, nt,ot,dt,mile, labour, mileage, call, mat, total:labour+mileage+call+mat,
      repairs:d.repairStatus||'', notes:d.comments||'', defects:d.defects||'', materials:(d.materials&&d.materials.length)||0});
  });
  rows.sort((a,b)=> String(a.job).localeCompare(String(b.job)));
  return rows;
}
const nk = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
let _eqMap=null,_eqFor=null;
function eqCanon(){
  if(_eqFor===D.reports&&_eqMap) return _eqMap;
  const g=new Map(); D.reports.forEach(r=>{ if(!nk(r.crane_no)) return; const k=nk(r.customer)+'|'+nk(r.crane_no); if(!g.has(k)) g.set(k,new Set()); g.get(k).add(nk(r.id_no)); });
  const map=new Map();
  g.forEach((ids,k)=>{ const reps=[]; [...ids].filter(Boolean).sort((a,b)=>b.length-a.length).forEach(id=>{ if(!reps.some(rp=>rp.includes(id))) reps.push(id); });
    ids.forEach(id=>map.set(k+'|'+id, id?(reps.find(rp=>rp.includes(id))||id):(reps.length===1?reps[0]:''))); });
  _eqMap=map; _eqFor=D.reports; return map;
}
// one key per physical crane: customer + crane no + ID, where an ID that is part of a longer ID for the same crane counts as the same
function eqKeyR(r){ const c=nk(r.crane_no), base=nk(r.customer)+'|'+c; if(!c) return base+'|'+nk(r.id_no); const m=eqCanon().get(base+'|'+nk(r.id_no)); return base+'|'+(m==null?nk(r.id_no):m); }
function dueList(withTracker=true){
  const canon=nameMap(), latest=new Map(), tod=parse(todayIso());
  D.reports.forEach(r=>{
    const k=eqKeyR(r)+'|'+(r.visit_type||'Service');
    const p=latest.get(k);
    if(!p || (r.report_date||'')>(p.report_date||'')) latest.set(k,r);
  });
  const out=[];
  latest.forEach(r=>{
    const lo=r.data&&r.data.loler, due = r.visit_type==='LOLER' ? ((lo&&lo.nextexam)||r.next_due) : r.next_due;
    const dd=parse(due); if(!dd) return;
    out.push({r, kind:r.visit_type||'Service', iso:iso(dd), days:Math.round((dd-tod)/864e5), eng:canon(r.engineer)});
  });
  if(withTracker) D.tracker.forEach(t=>{ const dd=parse(t.due_date); if(!dd) return; out.push({r:{customer:t.customer,crane_no:'',id_no:'',site:'',report_date:''}, kind:t.category, iso:iso(dd), days:Math.round((dd-tod)/864e5), eng:'Tracker', tracker:t}); });
  out.sort((a,b)=>a.days-b.days); return out;
}
function repairsList(){
  const canon=nameMap(), byEq=new Map(), cutoff=addDays(todayIso(),-30), open=[], done=[];
  D.reports.forEach(r=>{ const k=eqKeyR(r); if(!byEq.has(k)) byEq.set(k,[]); byEq.get(k).push(r); });
  byEq.forEach(vs=>{
    vs.sort((a,b)=>(a.report_date||'').localeCompare(b.report_date||''));
    const latest=new Map();
    vs.forEach(r=>{ ((r.data&&r.data.items)||[]).forEach(it=>{ if(it&&it.label&&it.status) latest.set(slug(it.group)+'__'+slug(it.label),{r,it}); }); });
    latest.forEach(x=>{
      if(x.it.status!=='URGENT' && x.it.status!=='ATTN') return;
      // The engineers' app files a completion under the report number OR the report id, sometimes with an "imp_" prefix (imported reports), so accept any of those.
      const tail='|'+slug(x.it.group)+'__'+slug(x.it.label);
      const bases=[x.r.data&&x.r.data.reportNo, x.r.report_no, x.r.id].filter(Boolean).map(String);
      const hits=bases.flatMap(bs=>[bs,'imp_'+bs,bs.replace(/^imp_/,'')]).map(bs=>D.comps[bs+tail]).filter(Boolean).sort((p,q)=>String(q.done_date||'').localeCompare(String(p.done_date||'')));
      const comp=hits[0];
      const item={r:x.r,it:x.it,eng:canon(x.r.engineer),comp,key:((x.r.data&&x.r.data.reportNo)||x.r.report_no||x.r.id)+tail};
      if(comp){ if((comp.done_date||'')>=cutoff) done.push(item); }
      else if(!(x.it.work&&String(x.it.work).trim())) open.push(item);
    });
  });
  open.sort((a,b)=>(a.it.status==='URGENT'?0:1)-(b.it.status==='URGENT'?0:1)||(a.r.report_date||'').localeCompare(b.r.report_date||''));
  return {open,done};
}

async function patchBooking(id, fields){

async function notifyEngineer(id){
  const res=await fetch(SB.url+'/functions/v1/push-send',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({action:'send',booking_id:id})});

function bookingText(b){
  return ['New job from Key Engineering'+(b.priority==='Urgent'?' - URGENT':''),
    b.customer, b.site||'', b.contact?('Contact: '+b.contact+(b.phone?' '+b.phone:'')):(b.phone?'Phone: '+b.phone:''),

async function issueBooking(b, engId){
  // people without their own login (Jordan, Ashleigh, Jono, Ricky) are chosen by name; the job goes out under the shared staff login and is sent by Text
  if(String(engId||'').startsWith('name:')){
    const nm=engId.slice(5), shared=D.people.find(x=>x.name==='keyengineeringstaff');
    await patchBooking(b.id,{engineer_id:shared?shared.id:null,engineer_name:nm,status:'issued',issued_at:new Date().toISOString()});
    return `Issued to ${nm}. They don't have their own login, so press Text on the booking to send it to their phone.`;
  }
  const person=D.people.find(x=>x.id===engId);
  if(!person) throw new Error('Choose an engineer first');
  await patchBooking(b.id,{engineer_id:engId,engineer_name:cap(person.name),status:'issued',issued_at:new Date().toISOString()});
  let note='';
  try{
    const r=await notifyEngineer(b.id);
    note = r.sent ? `Issued to ${cap(person.name)} and their phone has been notified.` : r.devices ? `Issued to ${cap(person.name)}, but the notification could not be delivered — use the Text button.` : `Issued to ${cap(person.name)}. They haven't switched on phone notifications yet — use the Text button.`;
  }catch(e){ note=`Issued to ${cap(person.name)}, but the notification failed (${e.message}) — use the Text button.`; }
  return note;
}
async function textEngineer(b){
  const sp=D.staffPhones.find(x=>x.name===b.engineer_name);

    num=(window.prompt('Mobile number for '+(b.engineer_name||'this engineer')+':')||'').replace(/[^0-9+]/g,'');
    if(!num) return;
    if(sp){ await api('/rest/v1/staff_phones?on_conflict=name',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({name:sp.name,phone:num,updated_at:new Date().toISOString()})}); sp.phone=num; }
    else { await api('/rest/v1/engineer_phones?on_conflict=user_id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:b.engineer_id,phone:num})}); D.phones[b.engineer_id]=num; }

// ---------- weekly job sheet folders ----------
// Filed automatically by the Job Manager's "Merge Job Sheets This Week" button: one folder per engineer per week ending (Sunday).
const firstKey = n => (String(n||'').trim().split(/\s+/)[0]||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const folderBlob = f => api('/storage/v1/object/authenticated/weekly-job-sheets/'+f.file_path).then(r=>r.blob());
const patchFolder = (id,patch) => api('/rest/v1/weekly_folders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(patch)});
function viewFolders(){
  if(!foldersWeek){ // Monday morning: open the newest week that actually has folders
    const w=D.folders.map(f=>f.week_ending).sort().pop();
    foldersWeek = w || addDays(monday(todayIso()),6);
  }
  const list=D.folders.filter(f=>f.week_ending===foldersWeek);
  const uid=(store.get('session')||{}).uid||'';
  const merged=new Set(list.map(f=>f.engineer_key)), miss={};
  if(!D.jobsBlocked) weekJobs(addDays(foldersWeek,-6)).forEach(j=>j.engs.forEach(e=>{ const k=firstKey(e); if(k&&k!=='unassigned'&&!merged.has(k)){ (miss[k]=miss[k]||{name:e,n:0}).n++; } }));
  const missing=Object.values(miss);
  const pill=f=>f.processed_at?'<span class="pill green">PROCESSED</span>':f.printed_at?'<span class="pill grey">PRINTED</span>':'<span class="pill amber">NEW</span>';

  $('v-folders').innerHTML=`<div class="bar"><button id="fPrev">◀</button><b>Week ending ${uk(foldersWeek)}</b> <span class="mute small">Mon ${uk(addDays(foldersWeek,-6))} to Sun ${uk(foldersWeek)}</span><button id="fNext">▶</button><button id="fNow">Latest</button><span class="sp"></span><button id="fAll" class="primary" ${list.length?'':'disabled'}>Print whole week</button></div>
  <div class="note">Filed automatically when an engineer presses “Merge Job Sheets This Week” in the Job Manager. Open a folder to print it, or use Print whole week for one combined PDF to print on Monday morning.</div>
  ${missing.length?`<div class="note"><b>Jobs found but not merged yet:</b> ${missing.map(m=>esc(m.name)+' ('+m.n+' job'+(m.n===1?'':'s')+')').join(', ')}. They need to press Merge Job Sheets This Week in the Job Manager.</div>`:''}
  <div class="card"><h2>Engineer folders <span class="mute small">${list.length}</span></h2><div class="wrap">${list.length?`<table><tr><th></th><th>Engineer</th><th class="r">Jobs</th><th>Merged</th><th></th></tr>${list.map(row).join('')}</table>`:'<span class="mute">Nothing has been merged for this week yet.</span>'}</div></div>`;
  $('fPrev').onclick=()=>{foldersWeek=addDays(foldersWeek,-7);viewFolders();};
  $('fNext').onclick=()=>{foldersWeek=addDays(foldersWeek,7);viewFolders();};
  $('fNow').onclick=()=>{foldersWeek='';viewFolders();};
  const fail=e=>{ $('msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; window.scrollTo({top:0,behavior:'smooth'}); };
  $('v-folders').querySelectorAll('button[data-fa]').forEach(b=>b.onclick=async()=>{
    const f=list.find(x=>x.id===b.dataset.id), act=b.dataset.fa; if(!f) return;
    b.disabled=true;
    try{
      if(act==='open'){
        const w=window.open('','_blank'); // opened first so the browser allows it
        try{ const url=URL.createObjectURL(await folderBlob(f)); if(w) w.location=url; else location.href=url; }catch(e){ if(w) w.close(); throw e; }
        b.disabled=false; return;
      }
      const now=new Date().toISOString();
      const patch = act==='printed' ? {printed_at:now,printed_by:uid} : Object.assign({processed_at:now,processed_by:uid}, f.printed_at?{}:{printed_at:now,printed_by:uid});
      await patchFolder(f.id,patch); await load(); render();
    }catch(e){ fail(e); b.disabled=false; }
  });
  $('fAll').onclick=async()=>{
    const btn=$('fAll'), label=btn.textContent; btn.disabled=true; btn.textContent='Building print pack…';
    const w=window.open('','_blank');
    try{
      if(!window.PDFLib) throw new Error('The PDF tool did not load. Check your connection and try again.');
      const out=await PDFLib.PDFDocument.create();
      for(const f of list){
        const src=await PDFLib.PDFDocument.load(await (await folderBlob(f)).arrayBuffer());
        (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
      }
      const url=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'}));
      if(w) w.location=url; else location.href=url;
    }catch(e){ if(w) w.close(); fail(e); }
    btn.disabled=false; btn.textContent=label;
  };
}

// ---------- engineer holidays ----------
// 25 days a year (1 Jan to 31 Dec) PLUS the 8 bank holidays. Weekends and bank holidays never count against the 25.
// Requests come from the Job Manager (pending); admins (Dave, Maxine) approve here. Staff and bank holidays live in Supabase.
const HOL_DEFAULT_DAYS = 25, HOL_CLASH_AT = 2;   // clash alert = this many people off the same working day
const HOL_FALLBACK = ['Dave','Rob','Jono','Ricky','Martyn','Jordan','Ashleigh','Maxine'];
let holMonth = todayIso().slice(0,8)+'01';
// Only the people in the holiday_approvers table (Dave, Rob, Maxine) can approve. Supabase enforces this too, so a page edit can't bypass it.
const isAdmin = () => D.hol.approvers.includes((store.get('session')||{}).uid);
const holStaff = () => { const a=D.hol.staff.filter(s=>s.active).sort((x,y)=>x.sort_order-y.sort_order).map(s=>s.name); return a.length?a:HOL_FALLBACK; };
const holBank = () => { const m={}; D.hol.bank.forEach(b=>{ m[b.day]=b.name; }); return m; };
const holLive = () => D.hol.reqs.filter(r=>r.status==='approved'||r.status==='pending');
const isWork = (s,bank) => { const g=parse(s).getDay(); return g>0&&g<6&&!bank[s]; };
const holAllow = (n,y) => { const v=D.hol.allow[n+'|'+y]; return v==null?HOL_DEFAULT_DAYS:v; };
const fmtDay = s => parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const inDays = s => Math.round((parse(s)-parse(todayIso()))/864e5);
const holErr = e => { $('msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; window.scrollTo({top:0,behavior:'smooth'}); };
const personName = id => { const p=D.people.find(x=>x.id===id); const n=(p&&p.name)||''; return n.charAt(0).toUpperCase()+n.slice(1); };
function nextWork(s,bank){ let n=addDays(s,1); for(let i=0;i<14&&!isWork(n,bank);i++) n=addDays(n,1); return n; }
function holWorkDays(r,bank,year){ const out=[]; for(let s=r.start_date;s<=r.end_date;s=addDays(s,1)){ if(year&&s.slice(0,4)!==String(year)) continue; if(isWork(s,bank)) out.push(s); } return out; }
const holDayCount = (r,bank,year) => holWorkDays(r,bank,year).length*(r.half_day?0.5:1);
function holOffByDay(from,to,bank){
  const m={};
  holLive().forEach(r=>{ for(let s=r.start_date<from?from:r.start_date; s<=r.end_date&&s<=to; s=addDays(s,1)){ if(isWork(s,bank)) (m[s]=m[s]||[]).push({staff:r.staff,status:r.status,half:r.half_day,id:r.id}); } });
  return m;
}
// Runs of working days where HOL_CLASH_AT or more people are off together
function holClashes(from,to){
  const bank=holBank(), off=holOffByDay(from,to,bank), out=[]; let prev=null;
  Object.keys(off).sort().forEach(s=>{
    const names=[...new Set(off[s].map(x=>x.staff))].sort();
    if(names.length<HOL_CLASH_AT){ prev=null; return; }
    const pend=off[s].some(x=>x.status==='pending'), key=names.join('|');
    if(prev&&prev.key===key&&nextWork(prev.end,bank)===s){ prev.end=s; prev.pending=prev.pending||pend; }
    else{ prev={start:s,end:s,names,key,pending:pend}; out.push(prev); }
  });
  return out;
}
function holSummary(){
  const t=todayIso(), bank=holBank(), live=holLive();
  return {
    offToday:[...new Set(live.filter(r=>r.status==='approved'&&r.start_date<=t&&r.end_date>=t&&isWork(t,bank)).map(r=>r.staff))],
    starting:live.filter(r=>r.start_date>t&&r.start_date<=addDays(t,14)).sort((a,b)=>a.start_date.localeCompare(b.start_date)),
    clashes:holClashes(t,addDays(t,90)),
    pending:D.hol.reqs.filter(r=>r.status==='pending').length
  };
}
// Who is off between today and N days ahead (approved and waiting-for-approval), for the Overview and Today tabs
function offList(days){
  const t=todayIso(), end=addDays(t,days), bank=holBank();
  return holLive().filter(r=>r.end_date>=t&&r.start_date<=end&&holWorkDays(r,bank).some(s=>s>=t&&s<=end))
    .sort((a,b)=>a.start_date.localeCompare(b.start_date)||String(a.staff).localeCompare(String(b.staff)))
    .map(r=>({r, now:r.status==='approved'&&r.start_date<=t&&r.end_date>=t&&isWork(t,bank), back:nextWork(r.end_date,bank)}));
}
function offCard(days){
  const list=offList(days);
  const rows=list.map(x=>{ const r=x.r;
    const dates=(r.start_date===r.end_date?fmtDay(r.start_date):fmtDay(r.start_date)+' to '+fmtDay(r.end_date))+(r.half_day?' (half day)':'')+(r.lieu?' · day in lieu':'');
    const st=r.status==='pending'?'<span class="pill amber">WAITING FOR APPROVAL</span>':x.now?'<span class="pill red">OFF TODAY</span>':'<span class="pill green">APPROVED</span>';
    return `<tr><td><b>${esc(r.staff)}</b></td><td>${esc(dates)}</td><td>${esc(fmtDay(x.back))}</td><td>${st}</td></tr>`; }).join('');
  return `<div class="card" id="offCard"><h2>Who is off <span class="mute small">${list.length?list.length+' booked · ':''}next ${days} days</span></h2>${list.length?`<div class="wrap"><table><tr><th>Engineer</th><th>Dates</th><th>Back at work</th><th></th></tr>${rows}</table></div>`:`<span class="mute">Nobody is booked off in the next ${days} days.</span>`}</div>`;
}
function holUsed(n,y){
  const bank=holBank(), t=todayIso(), o={taken:0,booked:0,pending:0};
  D.hol.reqs.filter(r=>r.staff===n&&!r.lieu&&(r.status==='approved'||r.status==='pending')).forEach(r=>{
    const f=r.half_day?0.5:1;
    holWorkDays(r,bank,y).forEach(s=>{ if(r.status==='pending') o.pending+=f; else if(s<=t) o.taken+=f; else o.booked+=f; });
  });
  return o;
}
// Days in lieu: working a bank holiday earns a day off, which does NOT come off the 25. Earned days are recorded in bank_holiday_work.
function holLieu(n){
  const bank=holBank(); let earned=0, taken=0, pending=0;
  D.hol.work.filter(w=>w.staff===n).forEach(w=>{ earned+=num(w.days); });
  D.hol.reqs.filter(r=>r.staff===n&&r.lieu&&(r.status==='approved'||r.status==='pending')).forEach(r=>{ const c=holDayCount(r,bank); if(r.status==='pending') pending+=c; else taken+=c; });
  return {earned,taken,pending,left:earned-taken-pending};
}
// What a new holiday would cost, who it clashes with, and whether it goes over the allowance (or the lieu balance)
function holPreview(n,s,e,half,lieu){
  if(!n||!s||!e||e<s) return {days:0,clash:[],over:[],text:'Choose the dates.'};
  const bank=holBank(), probe={start_date:s,end_date:e,half_day:half}, days=holDayCount(probe,bank);
  const off=holOffByDay(s,e,bank), clash=new Set();
  holWorkDays(probe,bank).forEach(d=>{ const others=[...new Set((off[d]||[]).filter(x=>x.staff!==n).map(x=>x.staff))]; if(others.length>=HOL_CLASH_AT-1) others.forEach(o=>clash.add(o)); });
  const over=[]; const years=[...new Set(holWorkDays(probe,bank).map(d=>d.slice(0,4)))];
  if(lieu){ const L=holLieu(n); if(days>L.left) over.push(days+' asked, only '+Math.max(0,L.left)+' day'+(L.left===1?'':'s')+' in lieu left'); }
  else years.forEach(y=>{ const u=holUsed(n,+y), mine=holDayCount(probe,bank,+y), left=holAllow(n,+y)-u.taken-u.booked-u.pending; if(mine>left) over.push(y+': '+mine+' days asked, '+Math.max(0,left)+' left'); });
  let text=days+' working day'+(days===1?'':'s')+(lieu?' in lieu':'')+' (weekends and bank holidays are not counted)';
  if(clash.size) text+=' · CLASHES with '+[...clash].join(', ');
  if(over.length) text+=' · '+(lieu?'NOT ENOUGH DAYS IN LIEU':'OVER ALLOWANCE')+' ('+over.join('; ')+')';
  return {days,clash:[...clash],over,text};
}

  const allowHtml=`<div class="card"><h2>${yr} allowances <span class="mute small">${HOL_DEFAULT_DAYS} days + ${stat.length} bank holidays</span></h2><div class="wrap"><table><tr><th>Engineer</th><th class="r">Allowance</th><th class="r">Taken</th><th class="r">Booked ahead</th><th class="r">Pending</th><th class="r">Left</th><th class="r">Lieu earned</th><th class="r">Lieu used</th><th class="r">Lieu left</th></tr>${allowRows}</table></div>
    <p class="mute small" style="margin:10px 0 0"><b>Bank holidays ${yr}:</b> ${stat.map(b=>esc(uk(b.day))+' '+esc(b.name)).join(' · ')||'none loaded for this year'}. These are on top of the allowance, so weekends and bank holidays are never counted as holiday taken. Working a bank holiday earns a day in lieu (record it in the box below); days in lieu don't come off the ${HOL_DEFAULT_DAYS}.${admin?' Change a person\'s allowance above for starters or carry-over.':''}</p></div>`;

      e.preventDefault();

      catch(err){ holErr(err); btn.disabled=false; }

    $('v-hols').querySelectorAll('button[data-wdel]').forEach(b=>b.onclick=async()=>{

    $('hForm').onsubmit=async e=>{
      e.preventDefault();

      if(!s||en<s){ holErr(new Error('Pick a start date, and an end date that is not before it.')); return; }

      const btn=$('hForm').querySelector('button[type=submit]'); btn.disabled=true; holOpen='h';
      try{ await api('/rest/v1/holiday_requests',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({staff:n,start_date:s,end_date:en,half_day:half,lieu,note:$('hNote').value.trim()||null,status:'approved'})}); await load(); render(); }
      catch(err){ holErr(err); btn.disabled=false; }
    };
  }

      :`<div class="empty-state">${D.custs.length?'No matches.':'No customers found yet. Customers are added in the Crane Service Report app.'}</div>`;
    const cust=k=>D.custs.find(c=>c.name_key===k), nm=c=>String((c.data&&c.data.customer)||c.name_key), pn=c=>String((c.data&&c.data.customerpin)||'').trim();
    const rpc=async(fn,body,done)=>{ try{ const r=await (await api('/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).text(); await load(); render(); $('msg').innerHTML='<div class="note">'+esc(done(r.replace(/"/g,'')))+'</div>'; window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ holErr(e); } };
    const flash=(b,t)=>{ const o=b.textContent; b.textContent=t; setTimeout(()=>{ b.textContent=o; },1600); };
    $('pinList').querySelectorAll('button[data-pgive]').forEach(b=>b.onclick=()=>{ const c=cust(b.dataset.pgive); b.disabled=true; rpc('generate_customer_pin',{p_name_key:c.name_key,p_force:false},pin=>'Portal access created for '+nm(c)+'. PIN: '+pin+'. Use “Copy login details” to send it to them.'); });
    $('pinList').querySelectorAll('button[data-pnew]').forEach(b=>b.onclick=()=>{ const c=cust(b.dataset.pnew); if(!confirm('Make a new PIN for '+nm(c)+'?\n\nTheir old PIN stops working straight away, so you will need to give them the new one.')) return; b.disabled=true; rpc('generate_customer_pin',{p_name_key:c.name_key,p_force:true},pin=>'New PIN for '+nm(c)+': '+pin+'. The old one no longer works.'); });
    $('pinList').querySelectorAll('button[data-prev]').forEach(b=>b.onclick=()=>{ const c=cust(b.dataset.prev); if(!confirm('Remove portal access for '+nm(c)+'?\n\nTheir PIN stops working straight away. You can give access again later with a new PIN.')) return; b.disabled=true; rpc('revoke_customer_pin',{p_name_key:c.name_key},()=>'Portal access removed for '+nm(c)+'.'); });
    $('pinList').querySelectorAll('button[data-pcopy]').forEach(b=>b.onclick=async()=>{ const ok=await copyText(pn(cust(b.dataset.pcopy))); flash(b,ok?'Copied ✓':'Not copied'); });
    $('pinList').querySelectorAll('button[data-plogin]').forEach(b=>b.onclick=async()=>{ const c=cust(b.dataset.plogin), url=(store.get('portal_url')||PORTAL_DEFAULT_URL).trim(), link=url?url+(url.includes('?')?'&':'?')+'c='+encodeURIComponent(nm(c)):''; const ok=await copyText('Key Engineering customer portal\n'+(link?'Address: '+link+'\n':'')+'Company name: '+nm(c)+'\nPIN: '+pn(c)); flash(b,ok?'Copied ✓':'Not copied'); });
  };
  list();
  $('pinSearch').oninput=ev=>{ pinQ=ev.target.value; list(); };
  $('pinPortal').onchange=ev=>store.set('portal_url',ev.target.value.trim());
  viewSupplierPortals();
}

      <label class="small mute" style="flex:1;min-width:150px">Our number<input id="pNum" placeholder="supplier / vendor / account no." value="${esc(e?e.number:'')}" style="width:100%"></label>
    </div>
    <div class="bar" style="box-shadow:none;align-items:flex-end">
      <label class="small mute" style="flex:2;min-width:220px">Portal link<input id="pUrl" placeholder="https://…" value="${esc(e?e.url:'')}" style="width:100%"></label>
      <label class="small mute" style="flex:2;min-width:220px">Notes<input id="pNotes" placeholder="contact, how to raise an invoice…" value="${esc(e?e.notes:'')}" style="width:100%"></label>
      <button class="primary" type="submit">${e?'Save changes':'Add portal'}</button>${e?'<button type="button" id="pCancel">Cancel</button>':''}

  const list=()=>{

    const rows=D.portals.filter(p=>!q||[p.customer,p.portal_name,p.number,p.notes,p.url].join(' ').toLowerCase().includes(q));
    $('pCount').textContent=rows.length+' of '+D.portals.length;
    $('pList').innerHTML=rows.length?`<div class="card"><div class="wrap"><table><tr><th>Customer</th><th>Portal</th><th>Our number</th><th>Notes</th><th></th></tr>${rows.map(p=>{ const u=portalUrl(p.url); return `<tr><td><b>${esc(p.customer)}</b></td><td>${esc(p.portal_name||'')}</td><td>${p.number?`<span style="font-variant-numeric:tabular-nums;font-weight:700">${esc(p.number)}</span> <button data-pc="${esc(p.id)}" aria-label="Copy number">Copy</button>`:'<span class="mute">–</span>'}</td><td class="small">${esc(p.notes||'')}</td><td style="white-space:nowrap">${u?`<button class="primary" data-po="${esc(p.id)}">Open portal ↗</button> `:''}<button data-pe="${esc(p.id)}">Edit</button> <button data-pd="${esc(p.id)}">Delete</button></td></tr>`; }).join('')}</table></div></div>`
      :`<div class="card"><div class="empty-state">${D.portals.length?'No matches.':'No customer portals saved yet. Use “Add a customer portal” above.'}</div></div>`;
    $('pList').querySelectorAll('button[data-po]').forEach(b=>b.onclick=()=>{ const p=D.portals.find(x=>x.id===b.dataset.po); const u=p&&portalUrl(p.url); if(u) window.open(u,'_blank','noopener'); });
    $('pList').querySelectorAll('button[data-pc]').forEach(b=>b.onclick=async()=>{ const p=D.portals.find(x=>x.id===b.dataset.pc); const ok=await copyText(p.number); b.textContent=ok?'Copied ✓':'Press and hold the number'; setTimeout(()=>{b.textContent='Copy';},1600); });
    $('pList').querySelectorAll('button[data-pe]').forEach(b=>b.onclick=()=>{ portalEdit=b.dataset.pe; viewSupplierPortals(); window.scrollTo({top:0,behavior:'smooth'}); });

      try{ await api('/rest/v1/customer_portals?id=eq.'+encodeURIComponent(p.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}); await load(); render(); }
      catch(err){ holErr(err); b.disabled=false; }
    });
  };
  list();
  $('pSearch').oninput=ev=>{ portalQ=ev.target.value; list(); };
  if($('pCancel')) $('pCancel').onclick=()=>{ portalEdit=null; viewSupplierPortals(); };
  $('pForm').onsubmit=async ev=>{
    ev.preventDefault();
    const urlIn=$('pUrl').value.trim(), url=portalUrl(urlIn);
    if(urlIn&&!url){ holErr(new Error('The portal link must start with http:// or https://')); return; }
    const body={customer:$('pCust').value.trim(),portal_name:$('pName').value.trim()||null,number:$('pNum').value.trim()||null,url:url||null,notes:$('pNotes').value.trim()||null,updated_at:new Date().toISOString()};
    const btn=$('pForm').querySelector('button[type=submit]'); btn.disabled=true;
    try{
      if(e) await api('/rest/v1/customer_portals?id=eq.'+encodeURIComponent(e.id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
      else await api('/rest/v1/customer_portals',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
      portalEdit=null; await load(); render();
    }catch(err){ holErr(err); btn.disabled=false; }
  };
}

// ---------- global command-room search ----------
// Report PDFs are filed in the report-pdfs bucket as <Customer>/<Visit type>/<Customer>_<Crane>_<Visit type>_<date>.pdf (same rule as the customer portal)
const pdfFolderCache = {};
const pdfFolderName = s => String(s==null?'':s).replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,60) || 'Unnamed_customer';
const pdfFileSafe = s => String(s==null?'':s).trim().replace(/[^a-z0-9]+/gi,'_');
async function reportPdfPath(r){
  const folder = pdfFolderName(r.customer)+'/'+(r.visit_type||'Service');
  if(!pdfFolderCache[folder]){
    const res = await api('/storage/v1/object/list/report-pdfs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:folder,limit:1000,offset:0})});
    pdfFolderCache[folder] = (await res.json()).filter(o=>o&&o.id).map(o=>o.name);
  }
  const files = pdfFolderCache[folder], crane = pdfFileSafe(r.crane_no), base = pdfFileSafe(r.customer)+(crane?'_'+crane:''), date = r.report_date||'', vt = r.visit_type||'Service';
  const f = vt==='LOLER' ? files.find(x=>x.startsWith(base+'_LOLER_')&&x.endsWith('_'+date+'.pdf')) : files.find(x=>x===`${base}_${vt}_${date}.pdf`);
  return f ? folder+'/'+f : null;
}
async function reportPdfUrl(r){
  let path = await reportPdfPath(r);
  if(!path){ delete pdfFolderCache[pdfFolderName(r.customer)+'/'+(r.visit_type||'Service')]; path = await reportPdfPath(r); }
  if(!path) throw new Error('No PDF has been filed for '+(r.report_no||'this report')+' ('+uk(r.report_date)+'). The record is there, but the engineer has not saved the PDF yet.');
  const blob = await (await api('/storage/v1/object/authenticated/report-pdfs/'+path.split('/').map(encodeURIComponent).join('/'))).blob();
  return URL.createObjectURL(blob);
}
function runGlobalSearch(){
  const input=$('globalSearch'), box=$('searchResults');
  if(!input||!box) return;
  const q=input.value.trim().toLowerCase();
  if(!q){box.classList.add('hide');box.innerHTML='';return;}
  const hits=[];
  const words=q.split(/\s+/).filter(Boolean);
  const has=v=>{ const t=String(v==null?'':v).toLowerCase(); return words.every(w=>t.includes(w)); };
  D.jobs.forEach(j=>{
    const d=j.data||{};
    const hay=[d.job,j.id,d.customerName,d.customer,d.site,d.type,d.status,...(d.engineers||[])].join(' ');
    if(has(hay)) hits.push({type:'Job sheet',main:(d.job||j.id)+' · '+(d.customerName||d.customer||'Customer not set'),sub:[d.site,d.type,d.status].filter(Boolean).join(' · '),tab:'week',key:j.id,week:((d.time||[])[0]||{}).date||d.date||''});
  });
  D.reports.forEach(r=>{
    const kind=/loler/i.test(r.visit_type||'')?'LOLER':/insp/i.test(r.visit_type||'')?'Inspection':'Service';
    const hay=[r.report_no,r.customer,r.crane_no,r.id_no,r.visit_type,kind,'report',r.engineer,r.site,r.report_date,uk(r.report_date),r.next_due,uk(r.next_due)].join(' ');
    if(has(hay)) hits.push({type:kind+' report',main:(r.report_no||'Report')+' · '+(r.customer||'Customer not set'),sub:[r.visit_type,r.crane_no?'Crane '+r.crane_no:'',r.id_no?'ID '+r.id_no:'',r.site,r.engineer,uk(r.report_date)].filter(Boolean).join(' · '),tab:'due',key:r.id,report:r});
  });
  D.pos.forEach(p=>{
    const hay=[p.po_number,p.engineer_name,p.site_ref,p.description,p.status,p.requested_by].join(' ');
    if(has(hay)) hits.push({type:'Purchase order',main:(p.po_number||'PO request')+' · '+(p.site_ref||p.engineer_name||'Request'),sub:[p.status,p.description].filter(Boolean).join(' · '),tab:'po',key:p.id});
  });
  D.bookings.forEach(b=>{
    const hay=[b.customer,b.site,b.contact,b.phone,b.description,b.job_type,b.engineer_name,b.status].join(' ');
    if(has(hay)) hits.push({type:'Booking',main:(b.customer||'Booking')+' · '+(b.site||''),sub:[b.status,b.job_type,b.engineer_name].filter(Boolean).join(' · '),tab:'bookings',key:b.id});
  });
  const MAXHITS=80; const limited=hits.slice(0,MAXHITS);
  box.innerHTML=`<div class="result-head">${hits.length} matching record${hits.length===1?'':'s'}${hits.length>MAXHITS?' · showing first '+MAXHITS+' — type more of the name to narrow it':''}</div>`+
    (limited.length?limited.map((h,i)=>`<div class="result" role="button" tabindex="0" data-hit="${i}"><div class="result-type">${esc(h.type)}</div><div><div class="result-main">${esc(h.main)}</div><div class="result-sub">${esc(h.sub)}</div></div><div class="result-go">${h.report?`<button type="button" data-pdf="${i}" style="font-weight:800">Open PDF</button>`:'Open section →'}</div></div>`).join(''):`<div class="empty-state">No matching records in the data currently loaded. Try a customer name, crane number, job number or PO reference.</div>`);
  box.classList.remove('hide');
  box.querySelectorAll('button[data-pdf]').forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation(); const h=limited[+b.dataset.pdf], old=b.textContent; b.disabled=true; b.textContent='Opening…';
    // open the tab straight away (inside the click) so pop-up blockers allow it
    const w=window.open('','_blank');
    try{ const url=await reportPdfUrl(h.report); if(w) w.location=url; else location.href=url; }
    catch(e){ if(w) w.close(); $('msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; window.scrollTo({top:0,behavior:'smooth'}); }
    b.disabled=false; b.textContent=old;
  });
  box.querySelectorAll('[data-hit]').forEach(el=>{
    const open=()=>{const h=limited[+el.dataset.hit];if(h.tab==='week'&&h.week)weekStart=monday(h.week);tab=h.tab;store.set('tab',tab);render();box.classList.add('hide');input.blur();};
    el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
}


// ---------- engineers chat ----------
// Same threads / messages the engineers use on their phones (tables threads + messages, photos in the chat-photos bucket).
let chatThreads=[], chatOpen=null, chatMsgs=[], chatDraft='', chatTimer=null, chatNew=false, chatErr='';
const chatMe = () => { const p=D.profile; const n=(p&&p.name)||''; return {id:(store.get('session')||{}).uid, name:n.charAt(0).toUpperCase()+n.slice(1)||'Office'}; };
const chatTime = t => { const d=new Date(t), n=new Date(), hm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); return d.toDateString()===n.toDateString()?hm:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+hm; };
async function chatLoadThreads(){ chatThreads = await (await api('/rest/v1/threads?select=*&order=last_at.desc&limit=200')).json(); }
async function chatLoadMsgs(){ if(!chatOpen) return; chatMsgs = await (await api('/rest/v1/messages?select=*&thread_id=eq.'+encodeURIComponent(chatOpen)+'&order=created_at.asc&limit=1000')).json(); }
const chatPhotoCache = {};
async function chatPhoto(path){ if(chatPhotoCache[path]) return chatPhotoCache[path]; const b=await (await api('/storage/v1/object/authenticated/chat-photos/'+path.split('/').map(encodeURIComponent).join('/'))).blob(); return chatPhotoCache[path]=URL.createObjectURL(b); }
function chatMsgHtml(){
  const me=chatMe().id;
  return chatMsgs.length?chatMsgs.map(m=>`<div style="display:flex;${m.author_id===me?'justify-content:flex-end':''};margin:6px 0"><div style="max-width:min(560px,86%);padding:8px 12px;border-radius:12px;background:${m.author_id===me?'var(--accent)':'var(--bg)'};border:1px solid var(--line)"><div class="small" style="font-weight:800">${esc(m.author_name||'')} <span class="mute" style="font-weight:400">${esc(chatTime(m.created_at))}</span></div>${m.body?`<div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.body)}</div>`:''}${m.photo_path?`<img data-cphoto="${esc(m.photo_path)}" alt="Photo" style="max-width:100%;max-height:320px;margin-top:6px;border-radius:8px;cursor:zoom-in;background:var(--line);min-height:60px">`:''}</div></div>`).join(''):'<div class="mute">No messages yet.</div>';
}
function chatFillPhotos(root){
  root.querySelectorAll('img[data-cphoto]').forEach(async im=>{ if(im.src&&im.dataset.done) return; im.dataset.done='1'; try{ im.src=await chatPhoto(im.dataset.cphoto); im.onclick=()=>window.open(im.src,'_blank'); }catch(e){ im.alt='Photo could not be loaded'; } });
}
async function chatRefreshMsgs(){
  if(tab!=='chat'||!chatOpen) return;
  try{
    const before=chatMsgs.length; await chatLoadMsgs(); const box=$('chatMsgs'); if(!box) return;
    if(chatMsgs.length!==before){ const atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<80; box.innerHTML=chatMsgHtml(); chatFillPhotos(box); if(atEnd) box.scrollTop=box.scrollHeight; }
  }catch(e){}
}
async function viewChat(){
  const v=$('v-chat');
  clearInterval(chatTimer); chatTimer=setInterval(()=>{ if(tab!=='chat'||document.hidden){ if(tab!=='chat') clearInterval(chatTimer); return; } chatOpen?chatRefreshMsgs():chatLoadThreads().then(()=>{ if(tab==='chat'&&!chatOpen&&!chatNew&&!document.activeElement.closest?.('#v-chat')) viewChat(); }).catch(()=>{}); },15000);
  try{ await chatLoadThreads(); if(chatOpen) await chatLoadMsgs(); }catch(e){ v.innerHTML='<div class="err">Could not load the chat: '+esc(e.message)+'</div>'; return; }
  const admin=!!(D.profile&&D.profile.role==='admin'), me=chatMe();
  const th=chatOpen&&chatThreads.find(t=>t.id===chatOpen);
  if(chatOpen&&!th){ chatOpen=null; }
  if(!chatOpen){
    v.innerHTML=`${chatErr?`<div class="err">${esc(chatErr)}</div>`:''}<div class="bar"><b>Engineers chat</b><span class="mute small">${chatThreads.length} conversation${chatThreads.length===1?'':'s'}</span><span class="sp"></span><button class="primary" id="cNew">New conversation</button></div>
    ${chatNew?`<form id="cNewForm" class="card"><h2>New conversation</h2><div class="bar" style="box-shadow:none"><input id="cTitle" placeholder="What is it about? e.g. Top limit fault" style="flex:2;min-width:200px" required><input id="cTag" placeholder="Crane / site (optional)" style="flex:1;min-width:140px"><input id="cFirst" placeholder="First message (optional)" style="flex:3;min-width:200px"><button class="primary" type="submit">Start</button> <button type="button" id="cCancel">Cancel</button></div></form>`:''}
    <div class="card">${chatThreads.length?chatThreads.map(t=>`<div class="result" role="button" tabindex="0" data-th="${esc(t.id)}" style="display:block;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;${t.closed?'opacity:.6':''}"><div><b>${esc(t.title)}</b> ${t.tag?`<span class="pill amber">${esc(t.tag)}</span>`:''} ${t.closed?'<span class="pill grey">CLOSED</span>':''}</div><div class="small mute">${esc(t.last_by_name||'')}${t.last_text?': '+esc(String(t.last_text).slice(0,120)):''} · ${esc(chatTime(t.last_at||t.created_at))}</div></div>`).join(''):'<span class="mute">No conversations yet. Start one with “New conversation”.</span>'}</div>`;
    chatErr='';
    $('cNew').onclick=()=>{ chatNew=true; viewChat(); };
    if(chatNew){
      $('cCancel').onclick=()=>{ chatNew=false; viewChat(); };
      $('cNewForm').onsubmit=async e=>{
        e.preventDefault(); const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
        try{
          const r=await (await api('/rest/v1/threads',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({title:$('cTitle').value.trim(),tag:$('cTag').value.trim()||null,created_by:me.id,created_by_name:me.name})})).json();
          const id=r[0].id, first=$('cFirst').value.trim();
          if(first) await api('/rest/v1/messages',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({thread_id:id,body:first,author_id:me.id,author_name:me.name})});
          chatNew=false; chatOpen=id; viewChat();
        }catch(err){ chatErr='Could not start the conversation: '+err.message; btn.disabled=false; viewChat(); }
      };
    }
    v.querySelectorAll('[data-th]').forEach(el=>{ const go=()=>{ chatOpen=el.dataset.th; chatDraft=''; viewChat(); }; el.onclick=go; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }; });
    return;
  }
  v.innerHTML=`${chatErr?`<div class="err">${esc(chatErr)}</div>`:''}<div class="bar"><button id="cBack">◀ All conversations</button><b>${esc(th.title)}</b>${th.tag?` <span class="pill amber">${esc(th.tag)}</span>`:''}${th.closed?' <span class="pill grey">CLOSED</span>':''}<span class="sp"></span><button id="cClose">${th.closed?'Reopen':'Close conversation'}</button>${admin||th.created_by===me.id?'<button id="cDel">Delete</button>':''}</div>
  <div class="card"><div id="chatMsgs" style="max-height:55vh;overflow:auto;padding:4px">${chatMsgHtml()}</div>
  <form id="cForm" style="margin-top:12px"><div class="bar" style="box-shadow:none;margin:0"><textarea id="cText" rows="2" placeholder="Type a message…" style="flex:1;min-width:200px">${esc(chatDraft)}</textarea><label class="small mute" style="cursor:pointer">📷 Photo <input type="file" id="cFile" accept="image/*" style="display:none"></label><span id="cFileName" class="small mute"></span><button class="primary" type="submit">Send</button></div></form></div>`;
  chatErr='';
  const box=$('chatMsgs'); box.scrollTop=box.scrollHeight; chatFillPhotos(box);
  $('cBack').onclick=()=>{ chatOpen=null; chatDraft=''; viewChat(); };
  $('cText').oninput=e=>{ chatDraft=e.target.value; };
  $('cText').onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $('cForm').requestSubmit(); } };
  $('cFile').onchange=e=>{ $('cFileName').textContent=e.target.files[0]?e.target.files[0].name:''; };
  $('cClose').onclick=async()=>{ try{ await api('/rest/v1/threads?id=eq.'+encodeURIComponent(th.id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({closed:!th.closed})}); viewChat(); }catch(e){ chatErr=e.message; viewChat(); } };
  if($('cDel')) $('cDel').onclick=async()=>{ if(!confirm('Delete this whole conversation and all its messages?')) return; try{ await api('/rest/v1/threads?id=eq.'+encodeURIComponent(th.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}); chatOpen=null; viewChat(); }catch(e){ chatErr='Could not delete: '+e.message; viewChat(); } };
  $('cForm').onsubmit=async e=>{
    e.preventDefault(); const text=$('cText').value.trim(), file=$('cFile').files[0];
    if(!text&&!file) return;
    const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Sending…';
    try{
      let photo=null;
      if(file){
        photo=th.id+'/'+(crypto.randomUUID?crypto.randomUUID():String(Date.now()))+'.jpg';
        await api('/storage/v1/object/chat-photos/'+photo.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file});
      }
      await api('/rest/v1/messages',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({thread_id:th.id,body:text||null,photo_path:photo,author_id:me.id,author_name:me.name})});
      chatDraft=''; viewChat();
    }catch(err){ chatErr='Message not sent: '+err.message; chatDraft=text; viewChat(); }
  };
}

// ---------- customer page: everything about one customer on one screen ----------
let custQ='', custSel='', custType='All';
function custIndex(){
  const m=new Map();
  const get=name=>{ const k=nk(name); if(!k) return null; if(!m.has(k)) m.set(k,{key:k,name:String(name).trim(),rec:null,reports:[],tracker:[],visits:[],jobs:[]}); return m.get(k); };
  D.custs.forEach(c=>{ const nm=(c.data&&c.data.customer)||c.name_key; const e=get(nm); if(e){ e.rec=c; e.name=String(nm).trim(); } });
  D.reports.forEach(r=>{ const e=get(r.customer); if(e) e.reports.push(r); });
  D.tracker.forEach(t=>{ const e=get(t.customer); if(e) e.tracker.push(t); });
  D.visits.forEach(v=>{ const e=get(v.customer); if(e) e.visits.push(v); });
  D.jobs.forEach(j=>{ const d=j.data||{}, e=get(d.customerName||d.customer); if(e) e.jobs.push(j); });
  return m;
}

// ---------- backups (admin only): automatic weekly copy of all office data, plus a button to take one now ----------
async function loadBackups(){
  try{
    const r=await (await api('/storage/v1/object/list/backups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:'',limit:100,offset:0,sortBy:{column:'name',order:'desc'}})})).json();
    D.backups=(Array.isArray(r)?r:[]).filter(o=>o&&o.name&&/^backup-.*\.json$/.test(o.name)); D.backupErr='';
  }catch(e){ D.backups=null; D.backupErr=e.message; }
}
const bkTime = n => { const m=/backup-(\d{4})-(\d{2})-(\d{2})-(\d{2})-(\d{2})/.exec(n); return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])):null; };
function backupStale(){ if(!Array.isArray(D.backups)) return false; const t=D.backups.length?bkTime(D.backups[0].name):null; return !t||(Date.now()-t.getTime())>9*864e5; }
function viewBackups(){
  const draw=(note)=>{
    const list=D.backups, stale=backupStale();
    const rows=Array.isArray(list)?list.map(f=>{ const t=bkTime(f.name), mb=f.metadata&&f.metadata.size?(f.metadata.size/1048576).toFixed(1)+' MB':''; return `<tr><td>${t?esc(t.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'})):esc(f.name)}</td><td>${mb}</td><td class="r"><button data-bk="${esc(f.name)}">Download</button></td></tr>`; }).join(''):'';
    $('v-backups').innerHTML=`<div class="card"><h2>Backups</h2>
      <p style="margin:0 0 10px">Every Sunday at 3am a full copy of your office data is saved automatically (jobs, reports, customers, PINs, holidays, bookings, purchase orders, chat and more). The latest 12 are kept. Only office admins can see or download them.</p>
      ${Array.isArray(list)&&stale?'<div class="err">The newest backup is more than 9 days old (or there is none). Press “Back up now” and tell Claude if this keeps happening.</div>':''}
      ${D.backupErr?`<div class="err">${esc(D.backupErr)}</div>`:''}
      ${note?`<div class="note">${esc(note)}</div>`:''}
      <p><button class="primary" id="bkNow">Back up now</button></p>
      <p class="small mute" style="margin:0">Tip: every month or so, download one and keep it somewhere outside Supabase (a USB stick or OneDrive), so you always have a copy of your own. PDF reports are stored separately and are not inside these files.</p></div>
    <div class="card wrap"><h2>Saved backups <span class="mute small">${Array.isArray(list)?list.length:''}</span></h2>${Array.isArray(list)?(list.length?`<table><tr><th>Taken</th><th>Size</th><th></th></tr>${rows}</table>`:'<span class="mute">None yet.</span>'):'<span class="mute">Loading…</span>'}</div>`;
    $('bkNow').onclick=async()=>{ $('bkNow').disabled=true; $('bkNow').textContent='Backing up…'; try{ const j=await (await api('/functions/v1/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json(); await loadBackups(); draw(j.ok?'Backup saved ('+(j.bytes/1048576).toFixed(1)+' MB).':(j.error||'Backup did not finish.')); }catch(err){ draw('Backup failed: '+err.message); } };
    $('v-backups').querySelectorAll('button[data-bk]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ const j=await (await api('/storage/v1/object/sign/backups/'+encodeURIComponent(b.dataset.bk),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})})).json(); const a=document.createElement('a'); a.href=SB.url+'/storage/v1'+j.signedURL; a.download=b.dataset.bk; document.body.appendChild(a); a.click(); a.remove(); }catch(err){ draw('Could not download: '+err.message); } b.disabled=false; });
  };
  draw();
  if(!D.backupsLoading){ D.backupsLoading=true; loadBackups().then(()=>{ D.backupsLoading=false; if(tab==='backups') draw(); }); }
}

// ---------- shell ----------
const TABS=[['overview','Overview'],['today','Today'],['bookings','Bookings'],['week','Week'],['folders','Folders'],['hols','Holidays'],['due','Due soon'],['repairs','Repairs'],['po','POs'],['customers','Customers'],['portals','Portals'],['chat','Chat'],['fleet','Vans'],['backups','Backups']];
function render(){
  if(tab==='visits') tab='bookings';
  if((tab==='portals'||tab==='backups')&&!portalOK()) tab='overview';
  const due=dueList(), rep=repairsList();
  const badge={backups:(portalOK()&&backupStale())?'!':0, due:due.filter(d=>d.days<0).length, repairs:rep.open.length, po:D.pos.filter(p=>p.status==='pending').length, bookings:D.bookings.filter(b=>b.status==='booked').length+D.visits.filter(v=>v.status==='new').length, folders:D.folders.filter(f=>!f.printed_at).length, hols:D.hol.reqs.filter(r=>r.status==='pending').length, fleet:D.fleet.filter(f=>fleetDays(f)<=30).length};
  $('tabs').innerHTML=TABS.filter(([k])=>(k!=='portals'&&k!=='backups')||portalOK()).map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}${badge[k]?`<span class="n ${k==='due'||k==='backups'||(k==='hols'&&holSummary().clashes.length)?'hot':''}">${badge[k]}</span>`:''}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;store.set('tab',tab);render();});
  TABS.forEach(([k])=>$('v-'+k).classList.toggle('hide',k!==tab));
  $('v-visits').classList.toggle('hide',!(tab==='bookings'&&portalOK()));
  if(tab==='bookings'&&portalOK()) viewVisits();
  ({overview:viewOverview,today:viewToday,bookings:viewBookings,week:viewWeek,due:viewDue,repairs:viewRepairs,po:viewPo,folders:viewFolders,hols:viewHols,portals:viewPortals,chat:viewChat,fleet:viewFleet,customers:viewCustomers,backups:viewBackups})[tab]();
}
async function refresh(){ $('refresh').disabled=true; try{ await load(); render(); if(portalOK()) loadBackups().then(()=>render()); }catch(e){ if(!store.get('session')) showLogin(e.message); else $('msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'; } finally{ $('refresh').disabled=false; } }
function showLogin(m){ $('app').classList.add('hide'); $('login').classList.remove('hide'); $('loginErr').className='err'+(m?'':' hide'); $('loginErr').textContent=m||''; }
async function showApp(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); const s=store.get('session')||{}; $('who').textContent=s.email||''; $('who').title='Signed in as '+(s.email||''); tab=store.get('tab')||'overview'; if(tab==='visits') tab='bookings'; if(!TABS.some(t=>t[0]===tab)) tab='overview'; await refresh(); }

$('go').onclick=async()=>{
  $('go').disabled=true;
  try{
    const res=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok){ const m=j.error_description||j.msg||j.message||''; throw new Error(/invalid/i.test(m)?"That email or password isn't right. Use your full email address.":(m||'Sign-in failed ('+res.status+')')); }
    saveSession(j); $('pw').value=''; await showApp();
  }catch(e){ showLogin(e.name==='TypeError'?'No connection — check your signal and try again.':e.message); }
  $('go').disabled=false;
};
$('forgot').onclick=async()=>{
  const em=$('em').value.trim(), box=$('loginErr');
  if(!em){ showLogin('Type your email address above first, then tap Forgot password.'); return; }
  try{
    const res=await fetch(SB.url+'/auth/v1/recover',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:em})});
    if(res.ok){ box.className='note'; box.textContent='If that email has an account, a reset link is on its way. Open it on this device.'; }
    else showLogin('Could not send the reset email ('+res.status+').');
  }catch(e){ showLogin('No connection — check your signal and try again.'); }
};
$('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); });
$('out').onclick=()=>{ store.del('session'); showLogin(''); };
$('refresh').onclick=refresh;
$('globalSearch').addEventListener('input',runGlobalSearch);
$('globalSearch').addEventListener('keydown',e=>{if(e.key==='Escape'){$('globalSearch').value='';runGlobalSearch();}});
$('controlStatus').textContent='Signed-in session · last refresh shown on dashboard';
setInterval(()=>{ if(store.get('session') && !document.hidden) refresh(); }, 5*60*1000);
if(store.get('session')) showApp(); else showLogin('');
</script>
